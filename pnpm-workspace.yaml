# pnpm 11 ne lit plus ces réglages depuis .npmrc, ils vivent désormais ici
shamefullyHoist: true
strictPeerDependencies: false

allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@tailwindcss/oxide': true
  better-sqlite3: true
  esbuild: true
  prisma: true
  sharp: true
  vue-demi: true
